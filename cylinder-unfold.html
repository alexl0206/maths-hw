<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Cylinder Net Unfolding</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            overflow-x: hidden;
        }

        .scroll-track {
            height: 300vh;
            position: relative;
        }

        .sticky-viewport {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .instructions {
            position: absolute;
            top: 4vh;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .instructions h1 {
            margin: 0 0 5px 0;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .instructions p {
            margin: 0;
            color: #666;
            font-size: 0.85rem;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        .labels-layer {
            position: absolute;
            bottom: 6vh;
            display: flex;
            gap: 60px;
            font-size: 1.1rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .labels-layer.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="scroll-track">
        <div class="sticky-viewport">
            
            <div class="instructions">
                <h1>Cylinder Paper Net Unfolding</h1>
                <p>Scroll down to smoothly unroll the cylinder flat ↓</p>
            </div>

            <canvas id="animationCanvas" width="900" height="700"></canvas>

            <div class="labels-layer" id="geometryLabels">
                <div>Height = <strong>h</strong></div>
                <div>Width = Circumference <strong>(2πr)</strong></div>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d');
        const geometryLabels = document.getElementById('geometryLabels');

        const RADIUS = 85; 
        const HEIGHT = 280; 
        const CIRCUMFERENCE = 2 * Math.PI * RADIUS; 

        function drawScene() {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            const progress = Math.min(Math.max(scrollTop / maxScroll, 0), 1);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const tiltX = 0.4 * (1 - progress); 
            const rotY = -0.5 * (1 - progress); 

            if (progress > 0.95) {
                geometryLabels.classList.add('visible');
            } else {
                geometryLabels.classList.remove('visible');
            }

            function project(x, y, z) {
                const cosY = Math.cos(rotY);
                const sinY = Math.sin(rotY);
                let x1 = x * cosY - z * sinY;
                let z1 = x * sinY + z * cosY;

                const cosX = Math.cos(tiltX);
                const sinX = Math.sin(tiltX);
                let y2 = y * cosX - z1 * sinX;

                return { x: centerX + x1, y: centerY + y2 };
            }

            function drawArrow(ctx, fromX, fromY, toX, toY) {
                const headlen = 8; 
                const angle = Math.atan2(toY - fromY, toX - fromX);
                ctx.moveTo(fromX, fromY);
                ctx.lineTo(toX, toY);
                ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(toX, toY);
                ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            }


            const steps = 120;
            const outlineTop = [];
            const outlineBot = [];

            let currentHingeX = 0;
            let currentHingeZ = 0;

            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const finalLinearX = (t - 0.5) * CIRCUMFERENCE;
                const startingTheta = (t - 0.5) * Math.PI * 2;
                const currentTheta = startingTheta * (1 - progress);

                let x3d = RADIUS * Math.sin(currentTheta);
                let z3d = RADIUS * (Math.cos(currentTheta) - 1);

                const finalX = x3d * (1 - progress) + finalLinearX * progress;
                const finalZ = z3d * (1 - progress);

                outlineTop.push(project(finalX, -HEIGHT / 2, finalZ));
                outlineBot.push(project(finalX, HEIGHT / 2, finalZ));

                if (i === steps / 2) {
                    currentHingeX = finalX;
                    currentHingeZ = finalZ;
                }
            }

            if (progress < 0.95) {
                ctx.save();
                ctx.globalAlpha = 1 - progress;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;
                ctx.fillStyle = '#000000';

                const leftProfileIndex = Math.floor(steps * 0.22); 
                const topFrameP = outlineTop[leftProfileIndex];
                const botFrameP = outlineBot[leftProfileIndex];

                const offsetAmount = 45 * (1 - progress);
                const fTopX = topFrameP.x - offsetAmount;
                const fTopY = topFrameP.y;
                const fBotX = botFrameP.x - offsetAmount;
                const fBotY = botFrameP.y;

                ctx.beginPath();
                drawArrow(ctx, (fTopX + fBotX) / 2, (fTopY + fBotY) / 2 - 15, fTopX, fTopY);
                drawArrow(ctx, (fTopX + fBotX) / 2, (fTopY + fBotY) / 2 + 15, fBotX, fBotY);
                ctx.stroke();

                ctx.font = 'italic bold 16px system-ui, -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("h", (fTopX + fBotX) / 2, (fTopY + fBotY) / 2);
                ctx.restore();
            }

            function drawLid(isTop) {
                ctx.beginPath();
                ctx.fillStyle = 'rgba(245, 245, 245, 0.6)';
                ctx.strokeStyle = '#222222';
                ctx.lineWidth = 2;

                const totalLidSteps = 120;
                const targetHingeAngle = Math.PI / 2;
                const currentHingeAngle = targetHingeAngle * progress;

                let localCenterP = null;
                let localEdgeP = null;

                const chosenVectorAngle = isTop ? (Math.PI * 0.25) : (Math.PI * 0.75); 

                for (let i = 0; i <= totalLidSteps; i++) {
                    const angle = (i / totalLidSteps) * Math.PI * 2;
                    
                    const lx = RADIUS * Math.sin(angle);
                    const lz = RADIUS * Math.cos(angle);

                    const localY = 0;
                    const localZ = lz - RADIUS; 

                    const rotatedY = localY * Math.cos(currentHingeAngle) - localZ * Math.sin(currentHingeAngle);
                    const rotatedZ = localY * Math.sin(currentHingeAngle) + localZ * Math.cos(currentHingeAngle);

                    const finalX = lx + currentHingeX;
                    const finalY = (isTop ? -HEIGHT / 2 : HEIGHT / 2) + (isTop ? -rotatedY : rotatedY);
                    const finalZ = rotatedZ * (1 - progress) + currentHingeZ;

                    const p = project(finalX, finalY, finalZ);
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);

                    if (i === 0) {
                        const cRotatedY = - (-RADIUS) * Math.sin(currentHingeAngle);
                        const cRotatedZ = (-RADIUS) * Math.cos(currentHingeAngle);
                        const centerYPos = (isTop ? -HEIGHT / 2 : HEIGHT / 2) + (isTop ? -cRotatedY : cRotatedY);
                        localCenterP = project(currentHingeX, centerYPos, (cRotatedZ - RADIUS) * (1 - progress) + currentHingeZ);
                    }

                    const angleStepValue = (Math.PI * 2) / totalLidSteps;
                    if (Math.abs(angle - chosenVectorAngle) <= angleStepValue / 2 && !localEdgeP) {
                        localEdgeP = p;
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
// fade in
                if (localCenterP && localEdgeP && progress > 0.1) {
                    ctx.save();
                    
                    const radiusAlpha = Math.min(Math.max((progress - 0.1) / 0.6, 0), 1);
                    ctx.globalAlpha = radiusAlpha;

                    ctx.beginPath();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1.75;
                    ctx.moveTo(localCenterP.x, localCenterP.y);
                    ctx.lineTo(localEdgeP.x, localEdgeP.y);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.fillStyle = '#000000';
                    ctx.arc(localEdgeP.x, localEdgeP.y, 3.5, 0, 2 * Math.PI);
                    ctx.fill();

                    ctx.fillStyle = '#000000';
                    ctx.font = 'italic bold 15px system-ui, -apple-system, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const dx = localEdgeP.x - localCenterP.x;
                    const dy = localEdgeP.y - localCenterP.y;
                    const len = Math.hypot(dx, dy);
                    const nx = -dy / len; 
                    const ny = dx / len;  

                    const textX = (localCenterP.x + localEdgeP.x) / 2 + nx * 14;
                    const textY = (localCenterP.y + localEdgeP.y) / 2 + ny * 14;
                    ctx.fillText("r", textX, textY);

                    if (!isTop && progress > 0.8) {
                        const labelAlpha = Math.min(Math.max((progress - 0.8) / 0.15, 0), 1);
                        ctx.globalAlpha = labelAlpha;
                        ctx.font = '500 13px system-ui';
                        ctx.fillStyle = '#444444';
                        ctx.fillText("Base Area = πr²", localCenterP.x, localCenterP.y + 115);
                    }
                    ctx.restore();
                }
            }


            ctx.beginPath();
            ctx.fillStyle = '#f0f7ff'; 
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 2;

            ctx.moveTo(outlineTop[0].x, outlineTop[0].y);
            for (let i = 1; i < outlineTop.length; i++) ctx.lineTo(outlineTop[i].x, outlineTop[i].y);
            for (let i = outlineBot.length - 1; i >= 0; i--) ctx.lineTo(outlineBot[i].x, outlineBot[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = 'rgba(208, 225, 253, 0.4)'; 
            ctx.lineWidth = 1;
            for (let i = 2; i < outlineTop.length - 1; i += 4) {
                ctx.moveTo(outlineTop[i].x, outlineTop[i].y);
                ctx.lineTo(outlineBot[i].x, outlineBot[i].y);
            }
            ctx.stroke();

            drawLid(true);  
            drawLid(false); 


            if (progress < 0.99) {
                ctx.beginPath();
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                
                ctx.moveTo(outlineTop[0].x, outlineTop[0].y);
                ctx.lineTo(outlineBot[0].x, outlineBot[0].y);
                
                ctx.moveTo(outlineTop[outlineTop.length - 1].x, outlineTop[outlineTop.length - 1].y);
                ctx.lineTo(outlineBot[outlineBot.length - 1].x, outlineBot[outlineBot.length - 1].y);
                
                ctx.stroke();
            }
        }

        window.addEventListener('scroll', drawScene);
        window.addEventListener('resize', drawScene);
        drawScene();
    </script>
</body>
</html>
